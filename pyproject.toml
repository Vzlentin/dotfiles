[project]
name = "dotfiles"
version = "0.1.0"
description = "Personal dotfiles: the /go orchestration skill, project-memory, and a bash campaign loop that drains vault campaign queues"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
