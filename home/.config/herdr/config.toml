onboarding = false

[keys]
# Freed so the custom "open last ping" command below can own prefix+o.
open_notification_target = ""

# Global back-and-forth (pairs with prefix+o). h/j/k/l cover in-tab cycling.
last_pane = "prefix+tab"
cycle_pane_next = ""

# Sweep through agents in sidebar order. ctrl+alt chords are untouched by Ghostty/macOS.
previous_agent = ["ctrl+alt+h", "ctrl+alt+left"]
next_agent = ["ctrl+alt+l", "ctrl+alt+right"]

# Walk workspaces the same way.
previous_workspace = ["ctrl+alt+k", "ctrl+alt+up"]
next_workspace = ["ctrl+alt+j", "ctrl+alt+down"]

# Direct workspace jumps.
switch_workspace = "prefix+shift+1..9"

# prefix+shift+t is taken by the "move pane to new tab" command below.
rename_tab = "prefix+comma"

# prefix+g is taken by the "lazygit split" command below.
goto = "prefix+f"

[[keys.command]]
key = "prefix+t"
type = "popup"
description = "scratch shell"
command = "exec \"${SHELL:-sh}\""
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+o"
type = "shell"
description = "open last ping"
command = '''
target=$("$HERDR_BIN_PATH" agent list | jq -r '
  .result.agents as $all
  | ($all | map(select(.agent_status == "done" or .agent_status == "blocked"))) as $pings
  | (if ($pings | length) > 0 then $pings else $all end)
  | max_by(.state_change_seq).pane_id')
[ -n "$target" ] && "$HERDR_BIN_PATH" agent focus "$target"
'''

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane move $HERDR_ACTIVE_PANE_ID --new-tab --focus"

[[keys.command]]
key = "prefix+g"
type = "shell"
description = "lazygit split"
command = '''
pane=$("$HERDR_BIN_PATH" pane split $HERDR_ACTIVE_PANE_ID --direction right --focus | jq -r '.result.pane.pane_id')
[ -n "$pane" ] && "$HERDR_BIN_PATH" pane run "$pane" "exec lazygit"
'''

[[keys.command]]
key = "prefix+w"
type = "popup"
description = "attach to an agent of a workflows run"
command = '''
id=$(workflows list --pick) || exit 0
c=$(workflows show "$id" --pick) || exit 0
HERDR_PANE_ID=$HERDR_ACTIVE_PANE_ID workflows attach "$id" --conversation "$c" || { printf 'Press Enter to close'; read -r _; }
'''

[[keys.command]]
key = "prefix+m"
type = "popup"
description = "move pane to tab (left side)"
width = 40
height = 5
command = '''
h="$HERDR_BIN_PATH"; src="$HERDR_ACTIVE_PANE_ID"
printf 'Move pane to tab #: '; read -r n
tab=$("$h" tab list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r --argjson n "${n:-0}" '.result.tabs[$n-1].tab_id // empty')
[ -n "$tab" ] && [ "$tab" != "$HERDR_ACTIVE_TAB_ID" ] || exit 0
any=$("$h" pane list --workspace "$HERDR_ACTIVE_WORKSPACE_ID" | jq -r --arg t "$tab" '[.result.panes[] | select(.tab_id == $t)][0].pane_id')
target=$("$h" pane layout --pane "$any" | jq -r '.result.layout.focused_pane_id')
new=$("$h" pane move "$src" --tab "$tab" --split right --target-pane "$target" --focus | jq -r '.result.move_result.pane.pane_id')
[ -n "$new" ] && "$h" pane swap --source-pane "$new" --target-pane "$target" >/dev/null
'''

# prefix+t is taken by the "scratch shell" popup above.
[[keys.command]]
key = "prefix+alt+t"
type = "plugin_action"
description = "smart rename current tab"
command = "tab-smart-rename.rename-now"

[ui]
# Smart Rename names new tabs. A typed name would lock the tab.
prompt_new_tab_name = false


[theme]
name = "terminal"

# herdr-pi-theme writes Pi's `system` colors for the Ghostty theme here.
# BEGIN herdr-pi-theme
# Generated from Pi 1.3.0 `system` colors for Ghostty `Desert`. Run herdr-pi-theme to update.
[theme.custom]
accent = "#c0a172"
panel_bg = "#453d33"
active_row_bg = "#54371d"
selection_bg = "#54371d"
surface0 = "#453d33"
surface1 = "#5d5242"
surface_dim = "#8f816c"
overlay0 = "#968772"
overlay1 = "#b2a492"
text = "reset"
subtext0 = "#b2a492"
mauve = "#c0a172"
green = "#a2af5f"
yellow = "#b3a950"
red = "#e9877f"
blue = "#d39051"
teal = "#4dc174"
peach = "#a2af5f"
# END herdr-pi-theme

[update]
channel = "stable"
