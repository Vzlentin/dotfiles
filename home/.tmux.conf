# ── General ──────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g repeat-time 600
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on

# ── Terminal / color ──────────────────────────────────────────────────────
# tmux-256color is the active TERM (terminfo present); add truecolor on top.
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

# ── Clipboard ──────────────────────────────────────────────────────────────
# Headless box: DISPLAY is unset, so xclip is dead. set-clipboard on makes
# tmux emit OSC52 so copy-mode yanks reach the *local* terminal's clipboard.
set -g set-clipboard on

# ── Copy-mode (vi) ──────────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
# AZERTY-friendly entry/paste ([ and ] need AltGr). v = enter copy-mode (then
# v select, y yank); C-v = paste. Default [ / ] still work as fallback.
bind v copy-mode
bind C-v paste-buffer

# ── Keybindings ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
# Splits inherit the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# vim-style pane selection.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Repeatable pane resize.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# Pull the next/prev window's pane in beside the current one (side-by-side
# split). > = grab next, < = grab prev. Use -v for a stacked split instead.
bind > join-pane -h -s :+1
bind < join-pane -h -s :-1
# vim-tmux-navigator claims root C-l; restore clear-screen via prefix C-l.
bind C-l send-keys 'C-l'

# ── Status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour235,fg=colour250"
set -g status-left-length 30
set -g status-left " #[fg=colour114,bold]#S #[default]"
set -g status-right-length 60
set -g status-right "#[fg=colour110]#h #[fg=colour244]%Y-%m-%d #[fg=colour250]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "fg=colour114,bg=colour237,bold"

# ── Plugins (TPM) ───────────────────────────────────────────────────────────
# Session persistence across reboots / kill-server.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# Seamless C-h/j/k/l between vim splits and tmux panes (no prefix).
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Keep this LAST — TPM bootstrap.
run '~/.tmux/plugins/tpm/tpm'
